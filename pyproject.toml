[project]
name = "addrfmt"
version = "0.1.0"
description = "Normalise messy postal addresses and report parse errors with line/column numbers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "abrown891" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addrfmt"]
